# k8s/audit-log-service/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickkart-audit-log-service
  namespace: clickkart-app
  labels:
    app: clickkart-audit-log-service
    tier: application
spec:
  replicas: 3
  selector:
    matchLabels:
      app: clickkart-audit-log-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: clickkart-audit-log-service
        tier: application
    spec:
      containers:
        - name: clickkart-audit-log-service
          image: REGISTRY_PLACEHOLDER/clickkart-audit-log-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: clickkart-audit-log-service-config
            - secretRef:
                name: clickkart-audit-log-service-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # logback writes to ./logs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickkart-audit-log-service-config
  namespace: clickkart-app
data:
  CONFIG_SERVER_HOST: "clickkart-config-server.clickkart-app.svc.cluster.local"
  CONFIG_SERVER_PORT: "8888"
  EUREKA_SERVER_HOST: "clickkart-eureka-server.clickkart-app.svc.cluster.local"
  # No-default placeholders in the prod branch's clickkart-audit-log-service.properties - the pod
  # cannot start without them (see k8s/auth-service/deployment.yaml for the full rationale).
  AUDIT_LOG_SERVICE_HOSTNAME: "clickkart-audit-log-service.clickkart-app.svc.cluster.local"
  EUREKA_DASHBOARD_USERNAME: "admin"
  DB_USERNAME: "clickkart_audit_log_app"
---
apiVersion: v1
kind: Secret
metadata:
  name: clickkart-audit-log-service-secrets
  namespace: clickkart-app
type: Opaque
stringData:
  CONFIG_SERVER_PASSWORD: "REPLACED_BY_SECRETS_MANAGER"
  EUREKA_DASHBOARD_PASSWORD: "REPLACED_BY_SECRETS_MANAGER"
  DB_HOST: "REPLACED_BY_SECRETS_MANAGER"
  DB_PASSWORD: "REPLACED_BY_SECRETS_MANAGER"
