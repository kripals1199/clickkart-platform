# k8s/category-service/service-and-scaling.yaml
#
# ClusterIP only - reachable from the Gateway and other in-cluster services, never exposed
# directly to the internet. That is the Tier-1 ALB/Ingress's job: terminate TLS, forward to the
# Gateway, which then reaches this Service internally.
#
# Note the catalog reads are anonymous, which does NOT make this Service safe to expose: an open
# read surface still has ADMIN write routes on the same port, and ClusterIP is a routing decision
# rather than a security control. Anything already inside the cluster reaches this Service
# directly, so the service validates tokens itself and permits anonymous access to GET only.
apiVersion: v1
kind: Service
metadata:
  name: clickkart-category-service
  namespace: clickkart-app
spec:
  type: ClusterIP
  selector:
    app: clickkart-category-service
  ports:
    - port: 8086
      targetPort: 8086
---
# Horizontal Pod Autoscaler - replicas scale purely off CPU, with no replica needing to know
# about or coordinate with any other (stateless by design, see deployment.yaml).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clickkart-category-service
  namespace: clickkart-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clickkart-category-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
# PodDisruptionBudget - keeps enough replicas up during node drains and cluster upgrades that a
# rolling node replacement never drops available capacity to zero.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickkart-category-service
  namespace: clickkart-app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: clickkart-category-service
