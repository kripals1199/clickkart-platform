# docker-compose.dev-infra.yml
#
# Tier-3 STAND-IN for local development only. This file exists specifically so it, not
# docker-compose.app-tier.yml, is the one place a database or cache container is allowed to
# appear - the application tier's compose file must never own a datastore's lifecycle.
#
# Nothing in here is what actually deploys. Staging/prod point AUTH_DB_HOST, GATEWAY_REDIS_HOST
# etc. at a real managed Postgres/ElastiCache endpoint instead of these containers.
#
# Postgres is deliberately NOT containerized here - local dev connects to a real, already-
# installed native PostgreSQL instance instead (see .env.dev-infra.example: AUTH_DB_HOST etc.
# point at host.docker.internal), so app-tier containers reach the same durable data across
# `docker compose down`/`up` cycles without a Docker volume in between. Redis (ephemeral by
# nature - rate-limit counters, revoked-jti entries, captcha challenges) still runs here as a
# container, since there's no equivalent "just use what's already on the host" case for it.
#
# Usage:
#   docker compose -f docker-compose.dev-infra.yml -f docker-compose.app-tier.yml up -d

services:
  gateway-redis:
    image: redis:7-alpine
    container_name: clickkart-gateway-redis
    ports:
      - "${GATEWAY_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - clickkart-net

  # Own Redis for captcha-service - deliberately not shared with gateway-redis (rate-limit
  # counters/revoked-jti entries have no business living alongside challenge/answer hashes).
  captcha-redis:
    image: redis:7-alpine
    container_name: clickkart-captcha-redis
    ports:
      - "${CAPTCHA_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - clickkart-net

  # Local SMTP catcher. Accepts real SMTP (no auth/TLS) and exposes every captured message at
  # http://localhost:8025 - lets the genuine SmtpEmailSenderImpl path be exercised without any
  # provider credentials. Defined here rather than started by hand because .env's MAIL_HOST
  # points at it: as an ad-hoc container it silently disappeared on the next `compose up`,
  # leaving notification-service pointing at a host that no longer resolved.
  mailpit:
    image: axllent/mailpit:latest
    container_name: clickkart-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - clickkart-net

  # ---------------------------------------------------------------------------------------------
  # Observability. Here rather than in the app tier because Prometheus and Grafana are local
  # stand-ins for infrastructure a real environment provides - the same reason Postgres and Redis
  # live in this file. Nothing in the application tier depends on them, and the platform runs
  # perfectly well with this file omitted.
  # ---------------------------------------------------------------------------------------------
  prometheus:
    build:
      context: ./observability
      dockerfile: Dockerfile.prometheus
    image: clickkart/prometheus:1.0.0
    container_name: clickkart-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - clickkart-net

  grafana:
    build:
      context: ./observability
      dockerfile: Dockerfile.grafana
    image: clickkart/grafana:1.0.0
    container_name: clickkart-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # A default admin/admin login is the single most common way a monitoring stack ends up
      # readable from the internet, so the password is required rather than defaulted.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      # Nothing here is worth handing to a third party, and a monitoring tool that phones home about
      # a private platform's topology is a small, avoidable leak.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - clickkart-net

  loki:
    build:
      context: ./observability
      dockerfile: Dockerfile.loki
    image: clickkart/loki:1.0.0
    container_name: clickkart-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    networks:
      - clickkart-net

  promtail:
    build:
      context: ./observability
      dockerfile: Dockerfile.promtail
    image: clickkart/promtail:1.0.0
    container_name: clickkart-promtail
    # Read-only, and the only mount in this file that reaches outside the compose network. Promtail
    # needs the daemon to enumerate containers and stream their logs; it never needs to change
    # anything, and a writable Docker socket is effectively root on the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    networks:
      - clickkart-net

networks:
  clickkart-net:
    name: clickkart-net
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
