# observability/promtail-config.yml
#
# Reads container logs straight from the Docker daemon rather than from files. The alternative -
# mounting /var/lib/docker/containers - depends on the log driver staying json-file and on paths
# inside the VM, both of which are implementation details that change without notice.

server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://clickkart-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: clickkart-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Only this platform's containers. Without this filter Loki also ingests Prometheus, Grafana
      # and Loki's own logs, which crowd out the ones anybody wanted.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(clickkart-.*)'
        target_label: 'container'
        replacement: '$1'
      - source_labels: ['__meta_docker_container_name']
        regex: '/clickkart-.*'
        action: keep
      - source_labels: ['container']
        regex: 'clickkart-(.*)'
        target_label: 'service'
        replacement: '$1'
    pipeline_stages:
      # The correlation id is the whole point of centralised logging on this platform: Auth Service
      # mints one at login, every service carries it, and one id follows a request across all of
      # them. Promoting it to a label is what makes "show me everything that happened to this
      # request" a query rather than a grep across fourteen containers.
      #
      # It is a label rather than left in the line because Loki indexes labels and nothing else.
      - regex:
          expression: '^(?P<ts>\S+ \S+) \[(?P<thread>[^\]]*)\] (?P<level>[A-Z]+)\s+\[[^,]*,[^,]*,(?P<correlationId>[^\]]*)\]'
      - labels:
          level:
          correlationId:
