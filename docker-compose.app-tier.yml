# docker-compose.app-tier.yml
#
# Application tier ONLY. Every service here is a Spring Boot 4.x image built from this repo.
# There is deliberately no database (or Redis) service definition in this file - per-service
# datastore connection details come in entirely through environment variables with NO
# hardcoded fallback, pointing at whatever Tier-3 endpoint you provide (a real managed
# Postgres/ElastiCache instance, or the local stand-ins in docker-compose.dev-infra.yml).
#
# Local dev, full stack against the Tier-3 stand-ins:
#   docker compose -f docker-compose.dev-infra.yml -f docker-compose.app-tier.yml up -d
#
# Local dev, full stack against a real shared/managed dev database:
#   AUTH_DB_HOST=my-dev-db.abc123.us-east-1.rds.amazonaws.com \
#   AUTH_DB_PASSWORD=... REVOCATION_REDIS_HOST=my-dev-cache.cache.amazonaws.com \
#   docker compose -f docker-compose.app-tier.yml up -d
#
# Each service also still has its own docker/docker-compose.yml with a bundled Postgres, kept
# unchanged for single-service inner-loop development - this file is the whole-stack,
# tier-boundary-correct alternative, not a replacement for it.

services:
  eureka-server:
    build:
      context: ./clickkart-eureka-server
      dockerfile: Dockerfile
    image: clickkart/eureka-server:1.0.0
    container_name: clickkart-eureka-server
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: ${EUREKA_HOSTNAME:-eureka-server}
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  config-server:
    build:
      context: ./clickkart-config-server
      dockerfile: Dockerfile
    image: clickkart/config-server:1.0.0
    container_name: clickkart-config-server
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8888
      CONFIG_SERVER_HOSTNAME: ${CONFIG_SERVER_HOSTNAME:-config-server}
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_SERVER_PORT: 8761
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  api-gateway:
    build:
      context: ./clickkart-api-gateway
      dockerfile: Dockerfile
    image: clickkart/api-gateway:1.0.0
    container_name: clickkart-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:-api-gateway}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD must be set}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_SERVER_PORT: 8761
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 cache endpoint - no container defined in this file, see header comment.
      REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  auth-service:
    build:
      context: ./clickkart-auth-service
      dockerfile: Dockerfile
    image: clickkart/auth-service:1.0.0
    container_name: clickkart-auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8081
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      AUTH_SERVICE_HOSTNAME: ${AUTH_SERVICE_HOSTNAME:-auth-service}
      AUTH_SERVICE_ADMIN_USERNAME: ${AUTH_SERVICE_ADMIN_USERNAME:-admin}
      AUTH_SERVICE_ADMIN_PASSWORD: ${AUTH_SERVICE_ADMIN_PASSWORD:?AUTH_SERVICE_ADMIN_PASSWORD must be set}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match api-gateway's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${AUTH_DB_HOST:?AUTH_DB_HOST must point to the Postgres endpoint for auth-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${AUTH_DB_PORT:-5432}
      DB_NAME: ${AUTH_DB_NAME:-clickkart_auth}
      DB_USERNAME: ${AUTH_DB_USERNAME:-clickkart_auth}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      # Tier-3-adjacent cache endpoint - no container defined in this file, see header comment.
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      # Empty/unset (default) is safe - trusts nothing but the immediate socket address. Set to
      # the real proxy's CIDR (e.g. the Gateway's) to honor X-Forwarded-For from it specifically.
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  notification-service:
    build:
      context: ./clickkart-notification-service
      dockerfile: Dockerfile
    image: clickkart/notification-service:1.0.0
    container_name: clickkart-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8082
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      NOTIFICATION_SERVICE_HOSTNAME: ${NOTIFICATION_SERVICE_HOSTNAME:-notification-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${NOTIFICATION_DB_HOST:?NOTIFICATION_DB_HOST must point to the Postgres endpoint for notification-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${NOTIFICATION_DB_PORT:-5432}
      DB_NAME: ${NOTIFICATION_DB_NAME:-clickkart_notification}
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-clickkart_notification}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set}
      # Email delivery. Unset = LoggingEmailSender (nothing actually sent, body goes to
      # logs/dispatch.log). MAIL_PASSWORD must be a Gmail App Password, and MAIL_FROM must
      # equal MAIL_USERNAME or Gmail drops the message.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      # SMS delivery. Unset = LoggingSmsSender. Requires a DLT-registered MSG91 template.
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  audit-log-service:
    build:
      context: ./clickkart-audit-log-service
      dockerfile: Dockerfile
    image: clickkart/audit-log-service:1.0.0
    container_name: clickkart-audit-log-service
    ports:
      - "${AUDIT_LOG_SERVICE_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8083
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      AUDIT_LOG_SERVICE_HOSTNAME: ${AUDIT_LOG_SERVICE_HOSTNAME:-audit-log-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${AUDIT_LOG_DB_HOST:?AUDIT_LOG_DB_HOST must point to the Postgres endpoint for audit-log-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${AUDIT_LOG_DB_PORT:-5432}
      DB_NAME: ${AUDIT_LOG_DB_NAME:-clickkart_audit_log}
      DB_USERNAME: ${AUDIT_LOG_DB_USERNAME:-clickkart_audit_log}
      DB_PASSWORD: ${AUDIT_LOG_DB_PASSWORD:?AUDIT_LOG_DB_PASSWORD must be set}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  captcha-service:
    build:
      context: ./clickkart-captcha-service
      dockerfile: Dockerfile
    image: clickkart/captcha-service:1.0.0
    container_name: clickkart-captcha-service
    ports:
      - "${CAPTCHA_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8084
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      CAPTCHA_SERVICE_HOSTNAME: ${CAPTCHA_SERVICE_HOSTNAME:-captcha-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      # Tier-3-adjacent cache endpoint - no container defined in this file, see header comment.
      # Own Redis, not shared with gateway-service/auth-service's - challenge/answer storage has
      # no business sharing a cache instance with rate-limit counters or revoked-jti entries.
      CAPTCHA_REDIS_HOST: ${CAPTCHA_REDIS_HOST:-captcha-redis}
      CAPTCHA_REDIS_PORT: ${CAPTCHA_REDIS_PORT:-6379}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  user-service:
    build:
      context: ./clickkart-user-service
      dockerfile: Dockerfile
    image: clickkart/user-service:1.0.0
    container_name: clickkart-user-service
    ports:
      - "${USER_SERVICE_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8085
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      USER_SERVICE_HOSTNAME: ${USER_SERVICE_HOSTNAME:-user-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      # Same secret as auth-service and api-gateway: this service verifies tokens auth-service
      # signed, so a different value here rejects every legitimate request.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${USER_DB_HOST:?USER_DB_HOST must point to the Postgres endpoint for user-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${USER_DB_PORT:-5432}
      DB_NAME: ${USER_DB_NAME:-clickkart_user}
      DB_USERNAME: ${USER_DB_USERNAME:-clickkart_user_app}
      DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD must be set}
      # Tier-3-adjacent cache endpoint - deliberately the SAME instance auth-service uses, because
      # this service reads the revoked-jti keyspace auth-service writes. Pointing it elsewhere
      # would silently stop logout from taking effect here.
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Empty/unset (default) is safe - trusts nothing but the immediate socket address. Set to
      # the real proxy's CIDR (e.g. the Gateway's) to honor X-Forwarded-For from it specifically.
      USER_TRUSTED_PROXY_CIDRS: ${USER_TRUSTED_PROXY_CIDRS:-}
      # Shared secret for the /internal/** surface. Required with no default: an unset key
      # makes the filter refuse every internal request, which is the safe failure but a
      # confusing one to debug at runtime rather than at startup.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set - guards user-service /internal/** service-to-service endpoints}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  category-service:
    build:
      context: ./clickkart-category-service
      dockerfile: Dockerfile
    image: clickkart/category-service:1.0.0
    container_name: clickkart-category-service
    ports:
      - "${CATEGORY_SERVICE_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8086
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      CATEGORY_SERVICE_HOSTNAME: ${CATEGORY_SERVICE_HOSTNAME:-category-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${CATEGORY_DB_HOST:?CATEGORY_DB_HOST must point to the Postgres endpoint for category-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${CATEGORY_DB_PORT:-5432}
      DB_NAME: ${CATEGORY_DB_NAME:-clickkart_category}
      DB_USERNAME: ${CATEGORY_DB_USERNAME:-clickkart_category_app}
      DB_PASSWORD: ${CATEGORY_DB_PASSWORD:?CATEGORY_DB_PASSWORD must be set}
      # Same instance auth-service writes revoked jtis to, so a logged-out ADMIN token stops
      # working here immediately rather than at its natural expiry.
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Distinct from user-service's key on purpose: compromising one service must not hand over
      # another's service-to-service credential. Product Service will hold both.
      INTERNAL_API_KEY: ${CATEGORY_INTERNAL_API_KEY:?CATEGORY_INTERNAL_API_KEY must be set - guards category-service /internal/** endpoints}
      CATEGORY_TRUSTED_PROXY_CIDRS: ${CATEGORY_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  product-service:
    build:
      context: ./clickkart-product-service
      dockerfile: Dockerfile
    image: clickkart/product-service:1.0.0
    container_name: clickkart-product-service
    ports:
      - "${PRODUCT_SERVICE_PORT:-8087}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8087
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      PRODUCT_SERVICE_HOSTNAME: ${PRODUCT_SERVICE_HOSTNAME:-product-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${PRODUCT_DB_HOST:?PRODUCT_DB_HOST must point to the Postgres endpoint for product-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${PRODUCT_DB_PORT:-5432}
      DB_NAME: ${PRODUCT_DB_NAME:-clickkart_product}
      DB_USERNAME: ${PRODUCT_DB_USERNAME:-clickkart_product_app}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD must be set}
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Three distinct secrets. The first guards this service's own /internal/**; the other two are
      # presented when calling Category's and User's. This is the service that makes per-service
      # keying worth the bookkeeping - it is the first to hold two of someone else's.
      INTERNAL_API_KEY: ${PRODUCT_INTERNAL_API_KEY:?PRODUCT_INTERNAL_API_KEY must be set - guards product-service /internal/** endpoints}
      CATEGORY_SERVICE_API_KEY: ${CATEGORY_INTERNAL_API_KEY:?CATEGORY_INTERNAL_API_KEY must be set - product-service calls category-service /internal/**}
      USER_SERVICE_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set - product-service calls user-service /internal/**}
      PRODUCT_TRUSTED_PROXY_CIDRS: ${PRODUCT_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  inventory-service:
    build:
      context: ./clickkart-inventory-service
      dockerfile: Dockerfile
    image: clickkart/inventory-service:1.0.0
    container_name: clickkart-inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT:-8088}:8088"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8088
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      INVENTORY_SERVICE_HOSTNAME: ${INVENTORY_SERVICE_HOSTNAME:-inventory-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${INVENTORY_DB_HOST:?INVENTORY_DB_HOST must point to the Postgres endpoint for inventory-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${INVENTORY_DB_PORT:-5432}
      DB_NAME: ${INVENTORY_DB_NAME:-clickkart_inventory}
      DB_USERNAME: ${INVENTORY_DB_USERNAME:-clickkart_inventory_app}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set}
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Its own key guards the reservation lifecycle - the only internal surface on this platform
      # that WRITES. A leak here could reserve away an entire shop's stock, not merely disclose it.
      INTERNAL_API_KEY: ${INVENTORY_INTERNAL_API_KEY:?INVENTORY_INTERNAL_API_KEY must be set - guards the reservation lifecycle}
      PRODUCT_SERVICE_API_KEY: ${PRODUCT_INTERNAL_API_KEY:?PRODUCT_INTERNAL_API_KEY must be set - inventory-service calls product-service /internal/**}
      INVENTORY_TRUSTED_PROXY_CIDRS: ${INVENTORY_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  order-service:
    build:
      context: ./clickkart-order-service
      dockerfile: Dockerfile
    image: clickkart/order-service:1.0.0
    container_name: clickkart-order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8089}:8089"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8089
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      ORDER_SERVICE_HOSTNAME: ${ORDER_SERVICE_HOSTNAME:-order-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${ORDER_DB_HOST:?ORDER_DB_HOST must point to the Postgres endpoint for order-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${ORDER_DB_PORT:-5432}
      DB_NAME: ${ORDER_DB_NAME:-clickkart_order}
      DB_USERNAME: ${ORDER_DB_USERNAME:-clickkart_order_app}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD must be set}
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Guards this service's own /internal/** - the seam Payment Service reports outcomes on.
      INTERNAL_API_KEY: ${ORDER_INTERNAL_API_KEY:?ORDER_INTERNAL_API_KEY must be set - guards the payment callback}
      # Three separate downstream keys, not one. They are not equally dangerous: the inventory key
      # can move a shop's stock, while the other two only read - so compromising something that
      # merely needed to look up a price must not also yield the power to reserve away that stock.
      PRODUCT_SERVICE_API_KEY: ${PRODUCT_INTERNAL_API_KEY:?PRODUCT_INTERNAL_API_KEY must be set - order-service prices SKUs against product-service /internal/**}
      INVENTORY_SERVICE_API_KEY: ${INVENTORY_INTERNAL_API_KEY:?INVENTORY_INTERNAL_API_KEY must be set - order-service drives the reservation lifecycle}
      # user-service's key is the unprefixed one - it was the platform's first internal surface and
      # predates the per-service naming. product-service references it the same way, above.
      USER_SERVICE_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set - order-service snapshots the delivery address from user-service /internal/**}
      CART_SERVICE_API_KEY: ${CART_INTERNAL_API_KEY:?CART_INTERNAL_API_KEY must be set - order-service reads and empties the basket at checkout}
      ORDER_TRUSTED_PROXY_CIDRS: ${ORDER_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  payment-service:
    build:
      context: ./clickkart-payment-service
      dockerfile: Dockerfile
    image: clickkart/payment-service:1.0.0
    container_name: clickkart-payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8090
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      PAYMENT_SERVICE_HOSTNAME: ${PAYMENT_SERVICE_HOSTNAME:-payment-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${PAYMENT_DB_HOST:?PAYMENT_DB_HOST must point to the Postgres endpoint for payment-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${PAYMENT_DB_PORT:-5432}
      DB_NAME: ${PAYMENT_DB_NAME:-clickkart_payment}
      DB_USERNAME: ${PAYMENT_DB_USERNAME:-clickkart_payment_app}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set}
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Guards this service's own /internal/**, which is read-only.
      INTERNAL_API_KEY: ${PAYMENT_INTERNAL_API_KEY:?PAYMENT_INTERNAL_API_KEY must be set - guards payment-service /internal/**}
      # The most dangerous key this service holds: it reads the amount to charge AND reports the
      # outcome, so whoever has it can declare any order paid for.
      ORDER_SERVICE_API_KEY: ${ORDER_INTERNAL_API_KEY:?ORDER_INTERNAL_API_KEY must be set - payment-service reads orders and reports outcomes}
      # The entire access control on the webhook - the one route on this platform with no bearer
      # token and no shared-secret header. Blank rejects every webhook, deliberately.
      WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set - signs the gateway webhook}
      # 'simulated' MOVES NO MONEY. Every payment is stamped simulated=true, and the service refuses
      # to start with this value under the prod profile.
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-simulated}
      # The simulator's outcome knobs. They exist in the properties file but had no way through to
      # the container, which made the decline path - the one that has to release the order's stock
      # and tell the customer - unreachable in dev except by rolling the 10% dice until it landed.
      # A failure path you cannot summon on demand is a failure path nobody exercises.
      SIMULATED_FAILURE_PERCENT: ${SIMULATED_FAILURE_PERCENT:-10}
      SIMULATED_PENDING_PERCENT: ${SIMULATED_PENDING_PERCENT:-10}
      SIMULATED_DECLINE_AMOUNT: ${SIMULATED_DECLINE_AMOUNT:-13.13}
      SIMULATED_PENDING_AMOUNT: ${SIMULATED_PENDING_AMOUNT:-17.17}
      PAYMENT_TRUSTED_PROXY_CIDRS: ${PAYMENT_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  cart-service:
    build:
      context: ./clickkart-cart-service
      dockerfile: Dockerfile
    image: clickkart/cart-service:1.0.0
    container_name: clickkart-cart-service
    ports:
      - "${CART_SERVICE_PORT:-8091}:8091"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8091
      CONFIG_SERVER_HOST: config-server
      CONFIG_SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-admin}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:?CONFIG_SERVER_PASSWORD must be set}
      CART_SERVICE_HOSTNAME: ${CART_SERVICE_HOSTNAME:-cart-service}
      EUREKA_SERVER_HOST: eureka-server
      EUREKA_DASHBOARD_USERNAME: ${EUREKA_DASHBOARD_USERNAME:-admin}
      EUREKA_DASHBOARD_PASSWORD: ${EUREKA_DASHBOARD_PASSWORD:?EUREKA_DASHBOARD_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - must match auth-service's JWT_SECRET exactly}
      # Tier-3 database endpoint - no container defined in this file, see header comment.
      DB_HOST: ${CART_DB_HOST:?CART_DB_HOST must point to the Postgres endpoint for cart-service (managed instance, or docker-compose.dev-infra.yml for local dev)}
      DB_PORT: ${CART_DB_PORT:-5432}
      DB_NAME: ${CART_DB_NAME:-clickkart_cart}
      DB_USERNAME: ${CART_DB_USERNAME:-clickkart_cart_app}
      DB_PASSWORD: ${CART_DB_PASSWORD:?CART_DB_PASSWORD must be set}
      REVOCATION_REDIS_HOST: ${GATEWAY_REDIS_HOST:-gateway-redis}
      REVOCATION_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      REVOCATION_REDIS_PASSWORD: ${GATEWAY_REDIS_PASSWORD:-}
      # Guards this service's own /internal/** - the two operations Order Service uses at checkout.
      # Neither can add to a basket: an internal API that could would be a way to put items into a
      # stranger's cart from inside the cluster.
      INTERNAL_API_KEY: ${CART_INTERNAL_API_KEY:?CART_INTERNAL_API_KEY must be set - guards the checkout seam}
      PRODUCT_SERVICE_API_KEY: ${PRODUCT_INTERNAL_API_KEY:?PRODUCT_INTERNAL_API_KEY must be set - cart-service prices SKUs against product-service /internal/**}
      CART_TRUSTED_PROXY_CIDRS: ${CART_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - clickkart-net

  # Admin Service (14) joins this file as its own `docker build`
  # entries, following the exact pattern above, as each is built per the build order - not stubbed
  # out here ahead of having real code to build.

# Declared the same way as docker-compose.dev-infra.yml (driver: bridge), not external: true -
# Compose treats an identical network declaration across merged files as idempotent, so this
# still works correctly when only this file is run standalone (e.g. against a real managed
# Tier-3 endpoint, no dev-infra file at all - see this file's header comment). external: true
# previously made the documented combined `-f dev-infra -f app-tier up -d` command fail on a
# genuinely clean Docker install/network prune: it required dev-infra.yml to have already been
# run at least once, standalone, to create the network first - an undocumented, easy-to-hit
# ordering dependency the header comment's own usage instructions didn't actually satisfy.
networks:
  clickkart-net:
    name: clickkart-net
    driver: bridge
